name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the slow tests (ECPP_SLOW=1, about an hour)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test]"
      - run: pytest -q --durations=10
        env:
          ECPP_SLOW: ${{ inputs.slow && '1' || '' }}
